<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Maker Preview</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; background: #1a1d24; }
        #renderCanvas { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }

        #tm-loading {
            position: absolute; inset: 0; z-index: 30; display: flex;
            align-items: center; justify-content: center;
            background: #1a1d24; color: #8a93a8;
            font: 13px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif;
        }
        #tm-hint {
            position: absolute; left: 10px; bottom: 12px; z-index: 20;
            font: 13px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: rgba(10, 10, 14, .78); color: #fff;
            padding: 6px 11px; border-radius: 999px; pointer-events: none;
            transition: opacity .4s; opacity: 0;
        }
        #tm-hint.show { opacity: 1; }
        .tm-gone { display: none !important; }
        #tm-stubs { display: none; }
    </style>
</head>

<body>
    <!-- Read-only model preview for the share page and the gallery modal.
         Same approach as the Rollercoaster Simulator preview: the runtime
         modules are loaded DIRECTLY and js/init.js is never loaded, so the
         editor is not hidden, it never exists. js/keyboard.js is skipped too
         (it registers document-level key handlers at load), and so is
         js/orientation-gizmo.js, which nothing in the runtime set calls. -->
    <canvas id="renderCanvas"></canvas>

    <div id="tm-hint">Drag to spin. Scroll to zoom.</div>
    <div id="tm-loading">Loading model...</div>
    <div id="tm-stubs"></div>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <!-- opentype + earcut are what build text objects; a project containing
         text would fail to load without them. The serializers bundle is export
         only, so it is left out. -->
    <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/earcut@2.2.4/dist/earcut.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/history.js"></script>
    <script src="js/size-handles.js"></script>
    <script src="js/transforms.js"></script>
    <script src="js/shapes.js"></script>
    <script src="js/properties.js"></script>
    <script src="js/selection.js"></script>
    <script src="js/align.js"></script>
    <script src="js/csg-operations.js?v=2"></script>
    <script src="js/view-modes.js"></script>
    <script src="js/pattern.js?v=2"></script>
    <script src="js/scene.js?v=1"></script>
    <script src="js/project-io.js"></script>

    <script>
    (function () {
        'use strict';

        /* Every element id the loaded modules reach for, stubbed hidden so no
           panel lookup can throw. Cheaper than auditing which of the 34 are
           guarded, and it cannot rot as the app changes. */
        var STUB_IDS = [
            'align-objects-section', 'auto-merge-checkbox', 'confirm-dialog-overlay',
            'confirm-yes-btn', 'create-pattern-btn', 'custom-font-url', 'custom-fonts-group',
            'custom-fonts-items', 'custom-fonts-list', 'dimension-label', 'intersect-btn',
            'isolate-btn', 'mirror-modal', 'objects-list', 'opacity-value', 'orientation-gizmo',
            'pattern-panel', 'pattern-preview-info', 'properties-content', 'quality-value',
            'section-btn', 'section-panel', 'snap-to-grid-btn', 'subtract-btn', 'text-depth',
            'text-font', 'text-input', 'text-modal', 'text-size', 'toggle-overlays-btn',
            'toggle-workplane-btn', 'union-btn', 'viewport-info', 'xray-btn'
        ];

        (function makeStubs() {
            var box = document.getElementById('tm-stubs');
            STUB_IDS.forEach(function (id) {
                if (document.getElementById(id)) return;
                var el = document.createElement('div');
                el.id = id;
                box.appendChild(el);
            });
        })();

        /* showToast appends to document.body, so it would drop editor chatter
           ("Loaded", "Grid & axes shown") onto someone's gallery card. */
        if (typeof window.showToast === 'function') window.showToast = function () {};
        window.confirm = function () { return true; };
        window.alert = function () {};

        var loaded = false;

        function el(id) { return document.getElementById(id); }

        function showHint() {
            var h = el('tm-hint');
            if (!h) return;
            h.classList.add('show');
            var done = false;
            function dismiss() {
                if (done) return;
                done = true;
                h.classList.remove('show');
                setTimeout(function () { h.classList.add('tm-gone'); }, 500);
            }
            window.addEventListener('pointerdown', dismiss, { once: true });
            window.addEventListener('touchstart', dismiss, { once: true });
            setTimeout(dismiss, 7000);
        }

        function makeViewOnly() {
            var engine = window.BABYLON && BABYLON.Engine.Instances[0];
            var scene = engine && engine.scenes && engine.scenes[0];
            if (!scene) return;

            /* Selection and the transform gizmos ride on the scene pointer
               observable. Babylon's own ArcRotateCamera input rides there too,
               so clearing it takes orbit down with the editor's handler;
               re-attaching the camera afterwards puts its observer back on the
               now-empty observable. Same fix as the BotForge preview. */
            try {
                scene.onPointerObservable.clear();
                var cam = scene.activeCamera;
                var canvas = engine.getRenderingCanvas();
                if (cam && canvas) {
                    try { cam.detachControl(); } catch (e) {}
                    cam.attachControl(canvas, true);
                }
            } catch (e) {}

            /* Nothing should be draggable in someone else's model. */
            try {
                if (window.gizmoManager) {
                    gizmoManager.attachToMesh(null);
                    gizmoManager.positionGizmoEnabled = false;
                    gizmoManager.rotationGizmoEnabled = false;
                    gizmoManager.scaleGizmoEnabled = false;
                    gizmoManager.boundingBoxGizmoEnabled = false;
                }
            } catch (e) {}

            /* Idle turntable, so a card reads as a model rather than a still.
               Babylon pauses it while the viewer drags and resumes after. */
            try {
                var c = scene.activeCamera;
                if (c && 'useAutoRotationBehavior' in c) {
                    c.useAutoRotationBehavior = true;
                    if (c.autoRotationBehavior) {
                        c.autoRotationBehavior.idleRotationSpeed = 0.15;
                        c.autoRotationBehavior.idleRotationWaitTime = 2000;
                        c.autoRotationBehavior.idleRotationSpinupTime = 1500;
                    }
                }
            } catch (e) {}
        }

        function finish() {
            el('tm-loading').classList.add('tm-gone');
            window.parent.postMessage({ type: 'PREVIEW_LOADED' }, '*');
        }

        async function initPreview(data) {
            if (loaded) return;
            loaded = true;

            try { initScene(); }
            catch (e) { console.warn('[3dmaker-preview] scene setup failed', e); }

            /* Restores the objects, their CSG history and the camera the maker
               left it on. Async: text objects load fonts. */
            try { await window.loadProjectData(data); }
            catch (e) { console.warn('[3dmaker-preview] load failed', e); }

            makeViewOnly();
            finish();
            showHint();
        }

        window.addEventListener('message', function (e) {
            var msg = e.data;
            if (!msg || msg.type !== 'LOAD_PREVIEW' || loaded) return;
            var data = msg.data;
            if (typeof data === 'string') {
                try { data = JSON.parse(data); } catch (err) { data = null; }
            }
            if (!data) { finish(); return; }
            initPreview(data);
        });

        window.parent.postMessage({ type: 'PREVIEW_READY' }, '*');
    })();
    </script>
</body>

</html>
